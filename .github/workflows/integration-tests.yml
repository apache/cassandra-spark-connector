name: Integration Tests

on:
  push:
    branches: [scylla-4.x]
  pull_request:
    branches: [scylla-4.x]

  workflow_dispatch:
    inputs:
      databases:
        description: 'Comma-separated database:version pairs, e.g. "scylla:LATEST,cassandra:4-LATEST"'
        required: false
        default: 'scylla:LATEST,scylla:LTS-LATEST,cassandra:3-LATEST,cassandra:4-LATEST,cassandra:5-LATEST'
        type: string
      scala-versions:
        description: 'Comma-separated scala versions (alternated across databases)'
        required: false
        default: '2-LATEST'
        type: string

  workflow_call:
    inputs:
      databases:
        description: 'Comma-separated list of database:version pairs, e.g. "scylla:LATEST,cassandra:4-LATEST"'
        required: false
        default: 'scylla:LATEST,scylla:LTS-LATEST,cassandra:3-LATEST,cassandra:4-LATEST,cassandra:5-LATEST'
        type: string
      scala-versions:
        description: 'Comma-separated scala versions - will be alternated across database versions'
        required: false
        default: '2-LATEST'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: "Compile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Restore SBT cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile all modules
        run: SCALA_VERSION=${{ inputs.scala-versions || '2-LATEST' }} make compile

      - name: Cache compiled classes
        uses: actions/cache/save@v4
        with:
          path: |
            **/target/scala-*
            **/target/streams
          key: compiled-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}

  lint:
    name: "Lint"
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Restore SBT cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Restore compiled classes
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*
            **/target/streams
          key: compiled-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}

      - name: Run scalastyle
        run: make lint

  prepare:
    name: "Prepare test matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate matrix with alternating scala versions
        id: matrix
        run: make generate-test-matrix DATABASES="${{ inputs.databases || 'scylla:LATEST,scylla:LTS-LATEST,cassandra:3-LATEST,cassandra:4-LATEST,cassandra:5-LATEST' }}" SCALA_VERSIONS="${{ inputs.scala-versions || '2-LATEST' }}"

  test:
    name: "${{ matrix.db-type }} ${{ matrix.db-version }} / scala ${{ matrix.scala }}"
    needs: [compile, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      CASSANDRA_VERSION: ${{ matrix.db-type == 'cassandra' && matrix.db-version || '' }}
      SCYLLA_VERSION: ${{ matrix.db-type == 'scylla' && matrix.db-version || '' }}
      SCALA_VERSION: ${{ matrix.scala }}
      TEST_PARALLEL_TASKS: 2
      PUBLISH_VERSION: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CCM
        run: make install-${{ matrix.db-type }}-ccm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: | # order matters: last one becomes JAVA_HOME (used by SBT)
            8
            11
            17

      - name: Set CCM Java home
        run: |
          # CCM_JAVA_HOME controls which JDK is used to start the database via CCM.
          # Cassandra 5.x requires Java 11+, older versions require Java 8.
          DB_MAJOR=$(echo "${{ matrix.db-version }}" | grep -oP '^\d+' || echo "0")
          if [[ "${{ matrix.db-type }}" == "cassandra" && "$DB_MAJOR" -ge 5 ]]; then
            echo "CCM_JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
          else
            echo "CCM_JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          fi

      - name: Restore SBT cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/Library/Caches/Coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Restore compiled classes
        uses: actions/cache/restore@v4
        with:
          path: |
            **/target/scala-*
            **/target/streams
          key: compiled-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/*.scala') }}

      - name: Resolve database version
        id: db-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make resolve-${{ matrix.db-type }}-version

      - name: Resolve Scala version
        id: scala-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make resolve-scala-version

      - name: Restore CCM cache
        uses: actions/cache/restore@v4
        id: ccm-cache
        with:
          path: ~/.ccm/${{ matrix.db-type == 'scylla' && 'scylla-repository' || 'repository' }}
          key: ccm-${{ runner.os }}-${{ steps.db-version.outputs.value }}

      - name: Pre-download database image
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        run: make download-${{ matrix.db-type }}

      - name: Save CCM cache
        uses: actions/cache/save@v4
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.ccm/${{ matrix.db-type == 'scylla' && 'scylla-repository' || 'repository' }}
          key: ccm-${{ runner.os }}-${{ steps.db-version.outputs.value }}

      - name: Run tests
        run: |
          if [ "${{ matrix.db-type }}" = "cassandra" ]; then
            make test-integration-cassandra
          else
            make test-integration-scylla
          fi

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/test-reports/*.xml'
          annotate_only: true
          detailed_summary: true
