name: CI

on:
  # Push runs are only needed for the long-lived branches (they test what was merged into them). Every other branch is
  # tested through its pull request, running both would run the same commit twice.
  push:
    branches:
      - trunk
      - master
      - 'b[0-9]*'
  pull_request:

  workflow_dispatch:

# A newer commit on the same branch/PR makes the still running CI of the older commit pointless, cancel it.
# The group is per event type so a push run and a pull_request run of one commit do not cancel each other, and
# manually dispatched runs (e.g. for flakiness comparisons) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala:  [2.13.18]
        db-version: [4.0.21, 4.1.12, 5.0.9]
        # dropped support for 3.11.19 in CI as OSS C* 5.0 release made 3.x releases EOL
        # dse-6.8.44 removing as DSE is now only available via IBM Fix Central

    steps:
      - uses: actions/checkout@v7

      - name: Install ccm via pip
        # if cassandra-ccm's trunk breaks this CI, please file a report,
        #  and temporarily switch this to @cassandra-test or @<sha> where sha is the last known working ccm commit
        run: pip install git+https://github.com/apache/cassandra-ccm.git@trunk

      # JDK 8 is only used by ccm to start Cassandra < 5 nodes (see ClusterModeExecutor.javaVersion). The ubuntu-latest
      # image has no JDK 8, so it is downloaded and the download is sometimes corrupted ("Checksum verification
      # failed"). Retry with another distribution (downloaded from a different host) when that happens.
      - name: Setup Java 8
        id: java8
        if: ${{ !startsWith(matrix.db-version, '5.') }}
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 8

      - name: Setup Java 8 (fallback)
        if: ${{ !startsWith(matrix.db-version, '5.') && steps.java8.outcome == 'failure' }}
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: 8

      - name: Setup Java 11 and 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: | # order is important, the last one is the default which will be used by SBT
            11
            17

      - name: sbt tests
        env:
          TEST_PARALLEL_TASKS: 1
          CCM_CASSANDRA_VERSION: ${{ matrix.db-version }}
          PUBLISH_VERSION: test
          JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          JAVA11_HOME: ${{ env.JAVA_HOME_11_X64 }}
          JAVA17_HOME: ${{ env.JAVA_HOME_17_X64 }}
          # Debug mode stops the ccm nodes at the end of a test group but keeps their directories; PRESERVE_LOGS puts
          # them under <working dir>/ccm-logs/ccm_127_<group> so the failure upload below can collect the node logs.
          CCM_CLUSTER_MODE: Debug
          PRESERVE_LOGS: ccm-logs
        run: sbt/sbt "++${{ matrix.scala }} ; testFull ; connectorIt/testFull ; shutdown"

      - name: Upload Cassandra node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cassandra-logs-${{ matrix.db-version }}
          path: |
            **/ccm-logs/**/logs/**
            **/ccm-logs/**/conf/**
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/out/**/test-reports/*.xml'
          annotate_only: true
